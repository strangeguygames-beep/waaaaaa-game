    <style>
        body { background-color: #171a21; color: white; font-family: Arial, sans-serif; text-align: center; padding-top: 15%; margin: 0; }
        .btn { display: inline-block; padding: 15px 30px; background-color: #2a475e; color: #66c0f4; border: none; border-radius: 5px; font-size: 18px; text-decoration: none; font-weight: bold; margin-top: 25px; cursor: pointer; }
        .btn:hover { background-color: #3b6485; }
        .hint { color: #8f98a0; font-size: 14px; margin-top: 30px; padding: 0 20px; line-height: 1.5; }
        .game-img { width: 80%; max-width: 300px; height: auto; border-radius: 8px; }
        .highlight { color: #66c0f4; font-weight: bold; }

        /* Spinner Android */
        #android-spinner { display: none; margin: 0 auto; flex-direction: column; align-items: center; justify-content: center; }
        .steam-loader-container { position: relative; width: 70px; height: 70px; margin: 0 auto 25px auto; }
        .steam-ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 4px solid #2a475e; border-top: 4px solid #66c0f4; border-radius: 50%; animation: spin 1s linear infinite; box-sizing: border-box; }
        .steam-logo-svg { width: 40px; height: 40px; position: absolute; top: 15px; left: 15px; fill: #8f98a0; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loading-text { font-size: 16px; font-weight: bold; color: #8f98a0; }
    </style>
</head>
