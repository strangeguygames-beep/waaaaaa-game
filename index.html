<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waaaaaa!</title>
    <style>
        body { background-color: #171a21; color: white; font-family: Arial, sans-serif; text-align: center; padding-top: 15%; margin: 0; }
        .btn { display: inline-block; padding: 15px 30px; background-color: #2a475e; color: #66c0f4; border: none; border-radius: 5px; font-size: 18px; text-decoration: none; font-weight: bold; margin-top: 25px; cursor: pointer; }
        .btn:hover { background-color: #3b6485; }
        .hint { color: #8f98a0; font-size: 14px; margin-top: 30px; padding: 0 20px; line-height: 1.5; }
        .game-img { width: 80%; max-width: 300px; height: auto; border-radius: 8px; }
        .highlight { color: #66c0f4; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loading">
        <p>Opening Steam...</p>
    </div>

    <div id="ios-prompt" style="display:none;">
        <img src="Logo_1-1.png" class="game-img" alt="Waaaaaa Logo">
        <br>
        <a id="steam-btn" class="btn" href="#">VIEW ON STEAM</a>
        <p class="hint">
            💡 <span class="highlight">Want to use the Steam App?</span><br>
            Tap the <span class="highlight">3 dots (...)</span> in the top right and select <span class="highlight">"Open in external browser"</span>.
        </p>
    </div>

    <script>
        (function() {
            const gameId = "2555000";
            const fallbackUrl = `https://store.steampowered.com/app/${gameId}/`;
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const queryString = window.location.search || ""; 
            const finalWebUrl = fallbackUrl + queryString;
            const isiOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

            if (isiOS) {
                // Su iPhone mostriamo subito la pagina di atterraggio pulita
                document.getElementById("loading").style.display = "none";
                document.getElementById("ios-prompt").style.display = "block";
                document.getElementById("steam-btn").href = finalWebUrl;
            } 
            else if (/android/i.test(userAgent)) {
                const encodedFallback = encodeURIComponent(finalWebUrl);
                window.location.href = `intent://store.steampowered.com/app/${gameId}/${queryString}#Intent;scheme=https;S.browser_fallback_url=${encodedFallback};end;`;
            } 
            else {
                window.location.href = finalWebUrl;
            }
        })();
    </script>

</body>
</html>
